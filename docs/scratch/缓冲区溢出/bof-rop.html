<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROP 利用链</title>
<style>
:root { --font: "LXGW WenKai Screen", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; --mono: "Cascadia Mono", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; }
:root, [data-theme="dark"] { --card: #232631; --sub: #1b1e27; --line: rgba(255,255,255,.08); --line2: rgba(255,255,255,.16); --text: #e3e5ea; --muted: #9ba2ae; --faint: #6c7380; --accent: #8c9eff; --hl: rgba(140,158,255,.16); --blue: #7aa7ff; --green: #5fcf8f; --amber: #f2b552; --red: #f07a83; --cyan: #5fd0dc; --violet: #c59cf0; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.18); }
[data-theme="light"] { --card: #ffffff; --sub: #f5f6f8; --line: rgba(0,0,0,.08); --line2: rgba(0,0,0,.16); --text: #1f2328; --muted: #59616b; --faint: #8b929c; --accent: #3f51b5; --hl: rgba(63,81,181,.10); --blue: #2f6fde; --green: #1b9a55; --amber: #b7770a; --red: #d43f55; --cyan: #0e8fa1; --violet: #8b4fd1; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px rgba(0,0,0,.06); }
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { padding: 4px 4px 12px; font: 14px/1.6 var(--font); color: var(--text); }
code { font-family: var(--mono); font-size: .92em; }
.demo { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.head { padding: 14px 18px 10px; }
.eyebrow { font-size: 11px; letter-spacing: .14em; color: var(--accent); font-weight: 700; }
.head h1 { margin: 2px 0 4px; font-size: 16px; }
.lead { margin: 0; color: var(--muted); font-size: 13px; }
.tabs { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; padding: 3px; border-radius: 10px; background: var(--sub); border: 1px solid var(--line); }
.tab { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.tab.on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.tab .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.body { display: grid; gap: 12px; padding: 0 18px 14px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); }
@media (max-width: 680px) { .body { grid-template-columns: minmax(0, 1fr); } }
.pane { background: var(--sub); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; position: relative; min-width: 0; }
.pane-t { font-size: 12px; color: var(--muted); margin-bottom: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.pane-t b { color: var(--text); font-weight: 600; }
pre.code { margin: 0; font: 12.5px/1.8 var(--mono); overflow-x: auto; }
.ln { display: block; padding-right: 8px; border-left: 3px solid transparent; border-radius: 4px; white-space: pre; transition: background .2s; }
.ln i { display: inline-block; width: 1.8em; margin-right: 10px; text-align: right; color: var(--faint); font-style: normal; user-select: none; }
.ln.cur { background: var(--hl); border-left-color: var(--accent); }
.ln.cur i { color: var(--accent); }
.tk-k { color: var(--violet); } .tk-t { color: var(--cyan); } .tk-s { color: var(--green); } .tk-n { color: var(--amber); } .tk-c { color: var(--faint); font-style: italic; } .tk-f { color: var(--blue); }
.narr { flex: 1; padding: 12px 18px; border-top: 1px solid var(--line); }
.meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.badge { padding: 0 8px; border-radius: 999px; background: var(--hl); color: var(--accent); font-weight: 600; }
.narr h2 { margin: 4px 0; font-size: 15px; }
.narr p { margin: 0; font-size: 13.5px; line-height: 1.8; }
.key { margin-top: 8px; padding: 7px 10px; border-radius: 8px; font-size: 13px; background: var(--hl); border-left: 3px solid var(--accent); }
.key b { color: var(--accent); margin-right: 8px; }
.key.warn { background: color-mix(in srgb, var(--red) 12%, transparent); border-left-color: var(--red); }
.key.warn b { color: var(--red); }
.ctl { display: flex; align-items: center; gap: 8px; padding: 10px 18px 14px; flex-wrap: wrap; border-top: 1px solid var(--line); }
.btn { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line2); background: var(--card); color: var(--text); font: inherit; font-size: 13px; padding: 5px 12px; border-radius: 8px; cursor: pointer; transition: border-color .15s, opacity .15s; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.pri { background: var(--accent); border-color: var(--accent); color: #fff; }
[data-theme="dark"] .btn.pri { color: #14172a; }
.dots { display: flex; gap: 6px; margin: 0 4px; }
.dots button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 99px; background: var(--line2); cursor: pointer; transition: all .2s; }
.dots button.done { background: color-mix(in srgb, var(--accent) 45%, transparent); }
.dots button.on { width: 22px; background: var(--accent); }
.hint { margin-left: auto; font-size: 12px; color: var(--faint); }
kbd { font: 11px var(--mono); padding: 0 5px; margin-right: 2px; border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 4px; }
.flash { animation: glow .9s ease; }
@keyframes glow { 0% { box-shadow: 0 0 0 2px var(--accent), 0 0 0 6px var(--hl); } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.stack { display: flex; flex-direction: column; gap: 4px; font: 12px/1.4 var(--mono); }
.slot { display: grid; grid-template-columns: 72px 1fr 88px; gap: 8px; align-items: center; padding: 7px 10px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); transition: background .25s, border-color .25s, opacity .25s; }
.slot .tag { font-size: 11px; color: var(--muted); }
.slot .val { font-weight: 600; word-break: break-all; }
.slot .addr { font-size: 11px; color: var(--faint); text-align: right; }
.slot.buf { border-color: color-mix(in srgb, var(--cyan) 45%, transparent); }
.slot.sfp { border-color: color-mix(in srgb, var(--violet) 45%, transparent); }
.slot.ret { border-color: color-mix(in srgb, var(--amber) 55%, transparent); }
.slot.arg { border-color: color-mix(in srgb, var(--blue) 40%, transparent); }
.slot.can { border-color: color-mix(in srgb, var(--green) 50%, transparent); }
.slot.gad { border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.slot.hl { background: var(--hl); box-shadow: inset 0 0 0 1px var(--accent); }
.slot.smash { background: color-mix(in srgb, var(--red) 16%, var(--card)); border-color: var(--red); }
.slot.dim { opacity: .45; }
.axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); margin: 2px 2px 6px; }
.rip { margin-top: 10px; padding: 8px 10px; border-radius: 8px; background: var(--card); border: 1px dashed var(--line2); font: 12.5px var(--mono); }
.rip b { color: var(--amber); }
.rip.bad b { color: var(--red); }
.rip.ok b { color: var(--green); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 12px; margin-top: 8px; font-size: 11px; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
.legend .l-buf::before { background: var(--cyan); }
.legend .l-can::before { background: var(--green); }
.legend .l-sfp::before { background: var(--violet); }
.legend .l-ret::before { background: var(--amber); }
.legend .l-gad::before { background: var(--accent); }

</style>
</head>
<body>
<div class="demo">
  <div class="head">
    <div class="eyebrow">交互演示 · 05 ROP</div>
    <h1>Return-Oriented Programming: 用现成指令拼「伪调用」</h1>
    <p class="lead">NX 使栈上 shellcode 无法执行. 于是把返回地址改成一串以 <code>ret</code> 结尾的 gadget, 借 libc / 二进制里已有的 <code>read</code> / <code>system</code> 完成利用. 对照 <code>05_rop_shell.c</code> + <code>exploit.py</code>.</p>
  </div>
  <div class="body">
    <div class="pane">
      <div class="pane-t"><b>示意链</b> (地址为演示占位)</div>
      <pre class="code" id="code"></pre>
    </div>
    <div class="pane">
      <div class="pane-t"><b>栈上的「参数表」与寄存器</b></div>
      <div id="mem"></div>
    </div>
  </div>
  <div class="narr" id="narr"></div>
  <div class="ctl" id="ctl"></div>
</div>
<script>
/* Shared step-through demo kit (same spirit as obsidian/c assets). */
var D = (function () {
  var root = document.documentElement, P = null;
  try { if (parent !== window && parent.document.body) P = parent.document; } catch (e) {}
  function theme() {
    var s = P && P.body.getAttribute('data-md-color-scheme');
    var dark = s ? s === 'slate' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'dark' : 'light';
  }
  theme();
  if (P) {
    new MutationObserver(theme).observe(P.body, { attributes: true, attributeFilter: ['data-md-color-scheme'] });
    P.querySelectorAll('link[rel="stylesheet"][href*="webfonts"]').forEach(function (l) {
      var n = document.createElement('link'); n.rel = 'stylesheet'; n.href = l.href; document.head.appendChild(n);
    });
  }
  function $(q) { return document.querySelector(q); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  var RE = /(\/\*.*?\*\/|\/\/.*)|("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*')|\b(void|int|char|size_t|ssize_t|long|const|struct)\b|\b(static|return|if|else|while|for|break|typedef|sizeof|NULL|__attribute__)\b|\b(0x[0-9a-fA-F]+|\d+)\b|\b([A-Za-z_]\w*)(?=\s*\()/g;
  function hl(line) {
    var out = '', last = 0, m; RE.lastIndex = 0;
    while ((m = RE.exec(line))) {
      out += esc(line.slice(last, m.index));
      out += '<span class="tk-' + (m[1] ? 'c' : m[2] ? 's' : m[3] ? 't' : m[4] ? 'k' : m[5] ? 'n' : 'f') + '">' + esc(m[0]) + '</span>';
      last = RE.lastIndex;
    }
    return out + esc(line.slice(last));
  }
  function code(pre, src) {
    pre.innerHTML = src.split('\n').map(function (l, k) {
      return '<span class="ln" data-n="' + (k + 1) + '"><i>' + (k + 1) + '</i>' + hl(l) + '</span>';
    }).join('');
  }
  function fit() {
    try { if (frameElement) frameElement.style.height = Math.ceil(document.documentElement.getBoundingClientRect().height) + 'px'; } catch (e) {}
  }
  function run(cfg) {
    var keys = Object.keys(cfg.modes), mode = keys[0], i = 0, timer = 0, lastW = -1;
    var demo = $('.demo'), pre = $('#code'), tabs = $('#tabs'), ctl = $('#ctl'), narr = $('#narr');
    if (tabs && keys.length > 1) {
      tabs.innerHTML = keys.map(function (k) {
        var m = cfg.modes[k];
        return '<button class="tab" data-m="' + k + '"><span class="dot" style="color:var(--' + (m.tone || 'accent') + ')"></span>' + m.label + '</button>';
      }).join('');
      tabs.onclick = function (e) {
        var b = e.target.closest('.tab');
        if (b && b.dataset.m !== mode) { stop(); mode = b.dataset.m; i = 0; build(); show(true); }
      };
    } else if (tabs) tabs.remove();
    ctl.innerHTML = '<button class="btn" data-a="prev">‹ 上一步</button><button class="btn pri" data-a="next">下一步 ›</button>' +
      '<button class="btn" data-a="play"></button><div class="dots"></div><button class="btn" data-a="reset">↺ 重置</button>' +
      '<span class="hint"><kbd>←</kbd><kbd>→</kbd>切换步骤</span>';
    ctl.onclick = function (e) {
      var b = e.target.closest('button'); if (!b) return;
      var a = b.dataset.a;
      if (b.dataset.i) { stop(); go(+b.dataset.i); }
      else if (a === 'play') { timer ? stop() : play(); }
      else { stop(); go(a === 'prev' ? i - 1 : a === 'next' ? i + 1 : 0); }
    };
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      e.preventDefault(); stop(); go(i + (e.key === 'ArrowRight' ? 1 : -1));
    });
    function steps() { return cfg.modes[mode].steps; }
    function go(k) { k = Math.max(0, Math.min(steps().length - 1, k)); if (k !== i) { i = k; show(true); } }
    function play() {
      if (i >= steps().length - 1) { i = 0; show(true); }
      timer = setInterval(function () { if (i >= steps().length - 1) stop(); else go(i + 1); }, cfg.interval || 3200);
      sync();
    }
    function stop() { if (timer) { clearInterval(timer); timer = 0; sync(); } }
    function build() {
      if (pre) code(pre, cfg.modes[mode].code);
      if (tabs) tabs.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('on', t.dataset.m === mode); });
      ctl.querySelector('.dots').innerHTML = steps().map(function (_, k) {
        return '<button data-i="' + k + '" aria-label="第 ' + (k + 1) + ' 步"></button>';
      }).join('');
    }
    function sync() {
      var n = steps().length;
      ctl.querySelectorAll('.dots button').forEach(function (d, k) { d.className = k === i ? 'on' : k < i ? 'done' : ''; });
      ctl.querySelector('[data-a="prev"]').disabled = i === 0;
      ctl.querySelector('[data-a="next"]').disabled = i === n - 1;
      ctl.querySelector('[data-a="play"]').textContent = timer ? '❚❚ 暂停' : '▶ 自动播放';
    }
    function show(anim) {
      var s = steps()[i], lines = [].concat(s.line || []);
      if (pre) pre.querySelectorAll('.ln').forEach(function (el) {
        el.classList.toggle('cur', lines.indexOf(+el.dataset.n) >= 0);
      });
      narr.innerHTML = '<div class="meta"><span>第 ' + (i + 1) + ' 步 / 共 ' + steps().length + ' 步</span>' +
        (s.phase ? '<span class="badge">' + s.phase + '</span>' : '') + '</div><h2>' + s.title + '</h2><p>' + s.text + '</p>' +
        (s.key ? '<div class="key"><b>要点</b>' + s.key + '</div>' : '') +
        (s.warn ? '<div class="key warn"><b>注意</b>' + s.warn + '</div>' : '');
      cfg.render(s, mode, anim);
      sync();
      fit();
    }
    function measure() {
      var m0 = mode, i0 = i, max = 0;
      demo.style.minHeight = '';
      keys.forEach(function (m) {
        mode = m; build();
        steps().forEach(function (_, k) { i = k; show(false); max = Math.max(max, demo.offsetHeight); });
      });
      mode = m0; i = i0; build(); show(false);
      demo.style.minHeight = max + 'px';
      fit();
    }
    function onResize() { if (innerWidth !== lastW) { lastW = innerWidth; measure(); } }
    addEventListener('resize', onResize);
    onResize();
    if (document.fonts) document.fonts.ready.then(measure);
  }
  return { $: $, code: code, run: run, fit: fit, esc: esc };
})();

</script>
<script>
(function () {
  var $ = D.$;
  var CODE = [
    '/* payload 覆写 saved rip 之后的布局 */',
    'pop rdi ; ret',
    '0                       /* stdin */',
    'pop rsi ; ret',
    '.bss                    /* 写入目标 */',
    'pop rdx ; ret',
    '8                       /* 读 8 字节 */',
    'read@plt                /* stage1 */',
    'pop rdi ; ret',
    '.bss                    /* "/bin/sh" */',
    'system@plt              /* stage2 */',
    'pop rdi ; ret',
    '0',
    'exit@plt                /* 干净退出 */'
  ].join('\n');

  var steps = [
    { line: 1, phase: '前提', title: '为何不是论文式 shellcode?',
      rdi: '?', rsi: '?', rdx: '?', bss: '(空)', stage: 0,
      text: '现代内核默认栈<strong>不可执行</strong> (NX/DEP). 即便把机器码灌进缓冲, CPU 也不许从栈上取指. 同时 ASLR 让「猜栈地址 + NOP sled」变难.',
      key: 'ROP: 不注入新代码, 只重排已有代码片段 (gadget) 的执行顺序.' },
    { line: 2, phase: '覆写 RET', title: '第一个返回地址 → pop rdi',
      rdi: '?', rsi: '?', rdx: '?', bss: '(空)', stage: 1, hl: ['g0'],
      text: '溢出把 saved rip 改成 <code>pop rdi; ret</code> 的地址. 函数一 <code>ret</code>, 就落到这条 gadget: 从栈上弹出下一个 qword 进 rdi, 再 ret 到下一项.',
      key: '栈上后续内容既是「返回地址序列」, 也是各 gadget 的立即数参数.' },
    { line: [2, 3], phase: '装配参数', title: 'rdi = 0 (stdin)',
      rdi: '0', rsi: '?', rdx: '?', bss: '(空)', stage: 1, hl: ['g0', 'a0'],
      text: '为即将调用的 <code>read(0, buf, 8)</code> 准备第一个参数. System V AMD64 ABI: 整型 / 指针参数依次进 rdi, rsi, rdx…',
      key: '小程序里常缺现成 gadget, 教学二进制用内联汇编「捐献」pop 序列 (见 05 源码).' },
    { line: [4, 5, 6, 7], phase: '装配参数', title: 'rsi=.bss, rdx=8',
      rdi: '0', rsi: '.bss', rdx: '8', bss: '(空)', stage: 1, hl: ['g1', 'g2'],
      text: '同样用 pop 链填 rsi / rdx. <code>.bss</code> 在 <code>-no-pie</code> 下是链接期固定地址, 因此不必泄露栈指针.',
      key: '这解释了为何 05 故意 <code>-no-pie</code>: 单独演示 ROP, 先不引入信息泄露.' },
    { line: 8, phase: 'stage1', title: 'ret → read@plt',
      rdi: '0', rsi: '.bss', rdx: '8', bss: '(空)', stage: 1, hl: ['call1'],
      text: '链转到 <code>read@plt</code>. 攻击者在<strong>另一次写入</strong>里送上 <code>"/bin/sh\\0"</code> (管道上要与第一段 payload 错开时序, 见 <code>exploit.py</code>).',
      key: '二段式: 第一次漏洞 read 已吃掉整段链; 需要再用 ROP 调一次 read 才能把字符串种进固定地址.' },
    { line: 8, phase: 'stage1 完成', title: '.bss 里种下 "/bin/sh"',
      rdi: '0', rsi: '.bss', rdx: '8', bss: '"/bin/sh"', stage: 2, hl: ['bss'],
      text: '<code>read</code> 返回后, 链上的下一个返回地址继续驱动后续 gadget (libc 函数返回时也会 ret 到链上).',
      key: '至此不必猜任何运行时栈地址.' },
    { line: [9, 10, 11], phase: 'stage2', title: 'system("/bin/sh")',
      rdi: '.bss', rsi: '.bss', rdx: '8', bss: '"/bin/sh"', stage: 2, hl: ['call2'],
      text: '再次 <code>pop rdi</code> 把 rdi 设为 .bss, 然后跳到 <code>system@plt</code>. 于是得到一个 shell —— 论文里 shellcode 的现代替代品.',
      key: 'x86-64 上 <code>system</code> 前栈需 16 字节对齐, 否则可能在内部 <code>movaps</code> 处 SIGSEGV; 必要时插入裸 <code>ret</code>.' },
    { line: [12, 13, 14], phase: '收尾', title: 'exit(0) 干净退出',
      rdi: '0', rsi: '.bss', rdx: '8', bss: '"/bin/sh"', stage: 3, hl: ['call3'],
      text: 'shell 退出后继续执行链尾: <code>exit(0)</code>. 便于用进程退出码验证整条链是否按设计走完 (<code>just demo-05</code> → exit=0).',
      key: '防护视角: canary 挡覆写, NX 逼出 ROP, ASLR+PIE 让 gadget/PLT 地址不再固定 —— 需组合生效.' }
  ];

  function reg(name, val, on) {
    return '<div class="slot' + (on ? ' hl' : '') + '"><span class="tag">' + name + '</span><span class="val">' + val + '</span><span class="addr">寄存器</span></div>';
  }
  function cell(id, tag, val, cls, on) {
    return '<div class="slot ' + cls + (on ? ' hl' : '') + '" data-id="' + id + '"><span class="tag">' + tag + '</span><span class="val">' + val + '</span><span class="addr">链上</span></div>';
  }

  function render(s) {
    var H = {};
    (s.hl || []).forEach(function (k) { H[k] = 1; });
    var stack = [
      '<div class="axis"><span>栈上链 (示意)</span><span></span></div>',
      cell('g0', 'gadget', 'pop rdi; ret', 'gad', H.g0),
      cell('a0', 'imm', '0', 'arg', H.a0),
      cell('g1', 'gadget', 'pop rsi; ret', 'gad', H.g1),
      cell('g2', 'gadget', 'pop rdx; ret', 'gad', H.g2),
      cell('call1', 'PLT', 'read@plt', 'ret', H.call1),
      cell('call2', 'PLT', 'system@plt', 'ret', H.call2),
      cell('call3', 'PLT', 'exit@plt', 'ret', H.call3),
      cell('bss', '.bss', s.bss, 'buf', H.bss)
    ];
    var regs = [
      '<div class="axis" style="margin-top:10px"><span>寄存器</span><span></span></div>',
      reg('rdi', s.rdi, H.a0 || H.call2),
      reg('rsi', s.rsi, H.g1),
      reg('rdx', s.rdx, H.g2)
    ];
    var tip = s.stage === 0 ? '尚未开始链' :
      s.stage === 1 ? '正在装配 / 调用 read' :
      s.stage === 2 ? '准备 / 调用 system' : '链尾 exit';
    $('#mem').innerHTML = '<div class="stack">' + stack.concat(regs).join('') + '</div>' +
      '<div class="rip">阶段: <b>' + tip + '</b></div>' +
      '<div class="legend"><span class="l-gad">gadget</span><span class="l-ret">PLT 调用</span><span class="l-buf">.bss 字符串</span></div>';
  }

  D.run({ modes: { main: { code: CODE, steps: steps } }, render: render, interval: 3600 });
})();
</script>
</body>
</html>
